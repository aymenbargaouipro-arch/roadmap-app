services:
  db:
    image: postgres:16-alpine
    container_name: roadmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap_db
    ports:
      # Ecoute uniquement sur ce poste (127.0.0.1) : la base n'est plus joignable par les
      # autres machines du reseau, qui auraient pu s'y connecter avec roadmap/roadmap.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap_db"]
      interval: 5s
      timeout: 5s
      retries: 5
