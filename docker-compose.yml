services:
  db:
    image: postgres:16-alpine
    container_name: roadmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap_db"]
      interval: 5s
      timeout: 5s
      retries: 5
